<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly AI Insight - Professional Tool Edition</title>

  <style>
    /* ✅ 기본 리셋 및 배경 설정 */
    html, body { 
      margin:0; padding:0; background:#ffffff; color:#111; 
      width:100%; height:100%; overflow:hidden; 
    }
    *, *::before, *::after { box-sizing:border-box; }

    /* ✅ 전체 컨테이너: 화면 정중앙 정렬을 위한 Flex 설정 */
    .bulletin-outer-container {
      width: 100%; height: 100vh; position: relative;
      display: flex; justify-content: center; align-items: center;
      font-family:'Pretendard','Malgun Gothic',sans-serif;
      background: #ffffff;
    }

    /* 배경 아이콘 */
    .bg-floating-icons { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .f-icon { position: absolute; opacity: 0.06; pointer-events: none; color: #000; }

    /* ✅ 카드 네비게이션 그룹 */
    .card-navigation-group { 
      position: relative; z-index: 10; 
      display: flex; justify-content: center; align-items: center;
    }

    /* ✅ 카드 본체 */
    .ai-card-wrapper {
      position: absolute; 
      width: 400px; height: 710px;
      background-color: #181818 !important; border-radius: 38px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 28px 80px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
      transform-origin: center center;
    }

    .ai-nav-input { display:none !important; }

    .ai-page {
      position:absolute; top:0; left:0; width: 400px; height: 710px;
      display: block;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      background-color: #181818;
      box-sizing: border-box;
      transition: opacity 0.38s ease;
    }

    /* 탭 전환: 페이드만 */
    #tab-intro:checked ~ .card-navigation-group .pg-intro,
    #tab-menu:checked ~ .card-navigation-group .pg-menu,
    #tab-1:checked ~ .card-navigation-group .pg-1, #tab-2:checked ~ .card-navigation-group .pg-2,
    #tab-3:checked ~ .card-navigation-group .pg-3, #tab-4:checked ~ .card-navigation-group .pg-4,
    #tab-5:checked ~ .card-navigation-group .pg-5, #tab-6:checked ~ .card-navigation-group .pg-6,
    #tab-7:checked ~ .card-navigation-group .pg-7, #tab-8:checked ~ .card-navigation-group .pg-8,
    #tab-9:checked ~ .card-navigation-group .pg-9, #tab-10:checked ~ .card-navigation-group .pg-10,
    #tab-11:checked ~ .card-navigation-group .pg-11, #tab-12:checked ~ .card-navigation-group .pg-12,
    #tab-13:checked ~ .card-navigation-group .pg-13, #tab-14:checked ~ .card-navigation-group .pg-14,
    #tab-15:checked ~ .card-navigation-group .pg-15, #tab-16:checked ~ .card-navigation-group .pg-16 {
      opacity: 1;
      pointer-events: auto;
      z-index: 20;
    }

    @media (prefers-reduced-motion: reduce) {
      .ai-page { transition: opacity 0.15s ease; }
    }

    /* [인트로 스타일] */
    .pg-intro {
      background-color: #181818; cursor: pointer;
      overflow: hidden;
    }
    .pg-intro img {
      position: absolute;
      top: 0; left: 0;
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: inherit;
      transform: scale(1.06);
      transform-origin: center center;
    }
    .pg-intro .page-footer {
      z-index: 30;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(0,0,0,0.75);
    }
    .intro-inner { 
      width: 100%; height: 100%; 
      display: flex; flex-direction: column; 
      justify-content: center; align-items: center; 
      position: relative; padding: 20px;
      text-align: center;
    }
    .intro-sub { font-size: 16px; font-weight: 700; color: rgba(255, 255, 255, 0.8); margin-bottom: 12px; letter-spacing: -0.5px; }
    .intro-logo { font-family: "Arial Black", sans-serif; font-size: 44px; font-weight: 900; color: #ffffff; letter-spacing: -2px; margin-bottom: 8px; line-height: 1.1; font-style: italic; }
    .intro-main { font-size: 28px; font-weight: 800; color: #ffffff; margin-bottom: 35px; letter-spacing: -1px; }
    .intro-desc { font-size: 16px; font-weight: 700; color: rgba(255, 255, 255, 0.6); line-height: 1.6; margin-bottom: 40px; word-break: keep-all; }
    
    /* 버튼 스타일 */
    .intro-hint-box { 
      display: inline-block; 
      background: linear-gradient(135deg, #001f3f 0%, #000c1a 100%);
      padding: 16px 36px; 
      border-radius: 50px; 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      margin-bottom: 18px; 
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }
    .intro-hint-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.15);
      background: linear-gradient(135deg, #002b55 0%, #00152a 100%);
    }
    .intro-hint { font-size: 16px; color: #ffffff; font-weight: 900; letter-spacing: -0.3px; }
    
    /* 공지 문구 스타일: 한 줄 최적화 */
    .intro-notice { font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, 0.4); line-height: 1.5; letter-spacing: -0.3px; white-space: nowrap; }

    .intro-signature { position: absolute; bottom: 35px; display: flex; align-items: center; gap: 8px; }
    .sig-text { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.8); }

    /* 상단 네비게이션 공통 버튼 */
    .btn-nav-top {
      position: absolute; top: 20px; right: 20px; z-index: 120; width: 38px; height: 38px;
      background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: 1px solid rgba(255,255,255,0.3);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .btn-nav-top:hover {
      transform: scale(1.12);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 4px 18px rgba(0,0,0,0.45);
      border-color: rgba(255,255,255,0.45);
    }
    .btn-nav-top:active { transform: scale(0.92); transition-duration: 0.08s; }

    /* 비주얼 이미지 영역 */
    .visual-area {
      position: absolute; top: 0; left: 0; width: 400px; height: 400px;
      z-index: 1; background-color: #181818;
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    .visual-area-overlay {
      position: absolute; top: 0; left: 0; width: 400px; height: 401px; 
      background: linear-gradient(to bottom, rgba(24,24,24,0) 0%, rgba(24,24,24,0) 20%, rgba(24,24,24,0.05) 35%, rgba(24,24,24,0.2) 50%, rgba(24,24,24,0.55) 70%, rgba(24,24,24,0.85) 85%, rgba(24,24,24,1) 92%, #181818 100%);
      z-index: 5; pointer-events: none;
    }

    .category-badge { position: absolute; top: 405px; left: 30px; padding:5px 12px; border-radius:7px; font-size:9px; font-weight:900; z-index: 20; }
    .ai-app-icon { position: absolute; top: 445px; left: 30px; width: 64px; height: 64px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.25); overflow:hidden; background:#222; z-index: 20;}
    .ai-app-icon img { width:100%; height:100%; object-fit:cover; display:block; }
    .ai-title-text { position: absolute; top: 460px; left: 110px; font-size:30px; font-weight:900; z-index: 20;}
    .ai-subtitle { position: absolute; top: 520px; left: 35px; width: 340px; font-size:16px; font-weight: 600; color:rgba(255,255,255,0.85); line-height:1.4; z-index: 20;}
    .brief-points { position: absolute; top: 570px; left: 35px; width: 340px; z-index: 20;}
    .point-item { font-size: 14px; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; color: #fff; }
    .point-dot { width:7px; height:7px; border-radius:50%; flex-shrink: 0; }
    
    /* 하단 안내 문구 */
    .page-footer { position:absolute; bottom:25px; width:100%; text-align:center; font-size:14px; font-weight:900; color: rgba(255,255,255,0.4); letter-spacing:1px; z-index: 20; }
    .badge-doc { color:#60a5fa; background:rgba(96,165,250,0.15); border:1px solid rgba(96,165,250,0.5); }
    .badge-auto { color:#c084fc; background:rgba(192,132,252,0.15); border:1px solid rgba(192,132,252,0.5); }
    .badge-img  { color:#fbbf24; background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.5); }
    .badge-video{ color:#fb7185; background:rgba(251,113,133,0.15); border:1px solid rgba(251,113,133,0.5); }

    .back-to-menu-label { display:block; width:100%; height:100%; position:absolute; top:0; left:0; cursor:pointer; z-index:50; }

    /* 메뉴 허브 전용 스타일 */
    .menu-title-fixed { position: absolute; top: 55px; left: 25px; font-size: 21px; font-weight: 900; }
    .menu-instruction-fixed { position: absolute; top: 86px; left: 25px; font-size: 11px; font-weight: 500; color: rgba(255, 255, 255, 0.4); }
    .cat-title { font-weight: 900; font-size: 13px; margin-bottom: 12px; }
    .cat-line { height: 1px; width: 350px; margin-top: -8px; margin-bottom: 12px; opacity: 0.4; }
    .hub-item {
      cursor: pointer; display: flex; flex-direction: column; align-items: center; width: 82px;
      position: relative; z-index: 1;
      transition: transform 0.22s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .hub-item:hover {
      transform: scale(1.14);
      z-index: 5;
    }
    .hub-item:active {
      transform: scale(1.02);
      transition: transform 0.08s ease;
    }
    .hub-icon-sm {
      width: 64px; height: 64px; border-radius: 16px; background: #252525;
      border: 1px solid rgba(255,255,255,0.15); overflow: hidden; margin-bottom: 7px;
      transition: box-shadow 0.22s ease, border-color 0.22s ease, filter 0.22s ease;
    }
    .hub-item:hover .hub-icon-sm {
      box-shadow: 0 10px 28px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.4);
      filter: brightness(1.08);
    }
    .hub-item:active .hub-icon-sm { filter: brightness(0.92); }
    .hub-icon-sm img { width: 100%; height: 100%; object-fit: cover; }
    .hub-name-sm {
      font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.5); text-align: center;
      transition: color 0.2s ease, transform 0.22s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .hub-item:hover .hub-name-sm { color: rgba(255,255,255,0.92); }
  </style>
</head>

  <script>
    function rescaleCard() {
      const wrapper = document.getElementById('cardWrapper');
      const navGroup = document.getElementById('navGroup');
      if(!wrapper || !navGroup) return;

      const windowH = window.innerHeight;
      const windowW = window.innerWidth;

      const scaleH = (windowH * 0.94) / 710;
      const scaleW = (windowW * 0.96) / 400;
      const currentScale = Math.min(scaleH, scaleW, 1.2);

      wrapper.style.transform = `scale(${currentScale})`;
      navGroup.style.width = (400 * currentScale) + 'px';
      navGroup.style.height = (710 * currentScale) + 'px';
    }

    window.addEventListener('resize', rescaleCard);
    window.addEventListener('load', rescaleCard);
    rescaleCard();
  </script>
